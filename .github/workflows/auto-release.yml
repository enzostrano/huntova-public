name: Auto bump version and release

# Every push to main:
#   1. Read VERSION from cli.py (e.g. "0.1.0a2012")
#   2. Increment the alpha-N suffix by 1 -> "0.1.0a2013"
#   3. Rewrite cli.py + pyproject.toml
#   4. Commit with [skip ci] (also: GITHUB_TOKEN pushes don't re-trigger
#      workflows, belt-and-suspenders), tag, push, create Release.
#
# Why increment from existing VERSION rather than `git rev-list --count`:
# this repo is a curated public mirror; the alpha-N suffix tracks the
# parent project's release counter (~2012), not the public history's
# commit count (14 at time of writing).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Compute new version (increment alpha-N)
        id: ver
        run: |
          set -euo pipefail
          OLD=$(grep -E '^VERSION[[:space:]]*=' cli.py | head -1 \
                | sed -E 's/.*"([^"]+)".*/\1/')
          if ! [[ "$OLD" =~ ^([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)$ ]]; then
            echo "::error::Unrecognized version shape in cli.py: $OLD (expected MAJOR.MINOR.PATCHaN)"
            exit 1
          fi
          BASE="${BASH_REMATCH[1]}"
          N="${BASH_REMATCH[2]}"
          NEW="${BASE}a$((N+1))"
          TAG="v$NEW"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; manual intervention needed."
            exit 1
          fi
          echo "old=$OLD"  >> "$GITHUB_OUTPUT"
          echo "new=$NEW"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "::notice::Version bump: $OLD -> $NEW"

      - name: Bump cli.py + pyproject.toml
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          NEW = os.environ["NEW"]
          for p, pat in [
              ("cli.py", r'^(VERSION\s*=\s*)"[^"]+"'),
              ("pyproject.toml", r'^(version\s*=\s*)"[^"]+"'),
          ]:
              path = pathlib.Path(p)
              text = path.read_text(encoding="utf-8")
              new_text, n = re.subn(pat, lambda m: m.group(1) + f'"{NEW}"',
                                    text, count=1, flags=re.MULTILINE)
              if n != 1:
                  raise SystemExit(f"failed to bump {p} (matches: {n})")
              path.write_text(new_text, encoding="utf-8")
              print(f"  bumped {p} -> {NEW}")
          PY

      - name: Commit + tag + push
        env:
          NEW: ${{ steps.ver.outputs.new }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli.py pyproject.toml
          git commit -m "chore: bump version to $NEW [skip ci]"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
