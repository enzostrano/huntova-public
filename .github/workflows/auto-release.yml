name: Auto bump version and release

# Every push to main:
#   1. Read VERSION from cli.py (e.g. "0.1.0a2012")
#   2. Increment alpha-N until we land on a tag that doesn't exist yet
#      (defensive against races where two pushes land in quick
#      succession and the second push reads a stale VERSION).
#   3. Rewrite cli.py + pyproject.toml
#   4. Commit with [skip ci], tag, push, create Release.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Compute new version (skip existing tags)
        id: ver
        run: |
          set -euo pipefail
          OLD=$(grep -E '^VERSION[[:space:]]*=' cli.py | head -1 \
                | sed -E 's/.*"([^"]+)".*/\1/')
          if ! [[ "$OLD" =~ ^([0-9]+\.[0-9]+\.[0-9]+)a([0-9]+)$ ]]; then
            echo "::error::Unrecognized version shape in cli.py: $OLD (expected MAJOR.MINOR.PATCHaN)"
            exit 1
          fi
          BASE="${BASH_REMATCH[1]}"
          N="${BASH_REMATCH[2]}"
          # Increment until we find a free tag — handles the race where
          # two pushes overlap and the second sees a stale VERSION (e.g.
          # because a code edit via the GitHub API reverted the bump
          # commit's version line).
          for _ in $(seq 1 50); do
            N=$((N+1))
            CANDIDATE="${BASE}a${N}"
            if ! git rev-parse "v${CANDIDATE}" >/dev/null 2>&1; then
              NEW="$CANDIDATE"
              break
            fi
          done
          if [[ -z "${NEW:-}" ]]; then
            echo "::error::No free tag found in 50 increments — manual intervention needed."
            exit 1
          fi
          TAG="v$NEW"
          echo "old=$OLD"  >> "$GITHUB_OUTPUT"
          echo "new=$NEW"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "::notice::Version bump: $OLD -> $NEW (tag $TAG)"

      - name: Bump cli.py + pyproject.toml
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          NEW = os.environ["NEW"]
          for p, pat in [
              ("cli.py", r'^(VERSION\s*=\s*)"[^"]+"'),
              ("pyproject.toml", r'^(version\s*=\s*)"[^"]+"'),
          ]:
              path = pathlib.Path(p)
              text = path.read_text(encoding="utf-8")
              new_text, n = re.subn(pat, lambda m: m.group(1) + f'"{NEW}"',
                                    text, count=1, flags=re.MULTILINE)
              if n != 1:
                  raise SystemExit(f"failed to bump {p} (matches: {n})")
              path.write_text(new_text, encoding="utf-8")
              print(f"  bumped {p} -> {NEW}")
          PY

      - name: Commit + tag + push
        env:
          NEW: ${{ steps.ver.outputs.new }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli.py pyproject.toml
          git commit -m "chore: bump version to $NEW [skip ci]"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        # Idempotent: if the tag was pushed in a prior attempt but
        # `gh release create` failed (network blip, rate limit), the
        # next run's tag-existence check would skip past this version
        # and the release would be permanently missing. Detect the
        # already-exists case and edit-in-place so the release always
        # shows up exactly once.
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — refreshing notes"
            gh release edit "$TAG" --draft=false --generate-notes
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
